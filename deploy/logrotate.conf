# logrotate configuration for mediaopt's optional file log.
#
# Install as /etc/logrotate.d/mediaopt (the file has no extension on purpose).
#
# When to use this file:
#   * deploy/mediaopt.service passes --log-file /var/log/mediaopt/mediaopt.log,
#     so the host install writes a file next to the journal.
#   * The container does NOT write a file: it logs to stdout and the json-file
#     driver in deploy/compose.example.yaml rotates that (max-size 50m,
#     max-file 5). This config is inert for the container.
#
# Why copytruncate instead of the usual rotate + reopen:
#   tracing-appender (src/main.rs) rotates the file daily by itself and keeps
#   the current file open. The process has no signal handler to reopen a log
#   file, so this config compresses/ages the *dated* files that the process
#   already produced and never asks it to reopen anything.
#
# The pattern matches the dated files (mediaopt.log.YYYY-MM-DD), not the live
# file: the process owns that one.

/var/log/mediaopt/mediaopt.log.* {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate

    # The unit runs as root and LogsDirectory=mediaopt creates the directory
    # owned by root. If you switch the service to User=mediaopt, change this to
    # `su mediaopt mediaopt` and `create 0640 mediaopt mediaopt`.
    su root root
    create 0640 root root
}
