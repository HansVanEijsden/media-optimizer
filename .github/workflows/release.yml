name: Release

# Build and publish the image to GHCR on purpose, not on every push.
#
#   tag v*           ->  ghcr.io/hansvaneijsden/media-optimizer:1.2.3 and :1.2
#   manual dispatch  ->  the tags for that ref; choose the platforms
#
# A push to main builds nothing here: CI already builds and smoke-tests the
# amd64 image on every code change, and the deployment hosts consume a pinned
# sha tag. An automatic release build would only spend 20-30 minutes of runner
# time (arm64 is emulated) for an image nobody pulls yet. Publish when a rollout
# is actually planned:
#
#   gh workflow run release.yml
#   gh workflow run release.yml -f platforms=linux/amd64,linux/arm64
#
# Platforms: the default is linux/amd64 because every deployment target is
# amd64. linux/arm64 runs under QEMU on the amd64 runner, compiles mozjpeg and
# libvips from source, and has hung once (45 minutes in the rust stage without
# progress), so it is opt-in.
#
# After the push, optionally POST to a deployment webhook so a managed
# deployment platform can pull the new image. The URL lives in the repository
# secret DEPLOY_WEBHOOK_URL and is never echoed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'target platforms; arm64 is emulated and slow, the default is amd64 only'
        required: false
        default: 'linux/amd64'
        type: string

permissions:
  contents: read
  # Push to ghcr.io with GITHUB_TOKEN.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half-way: a partially pushed manifest list would
  # leave :latest pointing at one architecture.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hansvaneijsden/media-optimizer
  # Defined at workflow level because `if:` cannot read `secrets.*` directly.
  # When the secret is not configured this is the empty string and the webhook
  # step is skipped.
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

jobs:
  publish:
    name: build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (only when arm64 is requested)
        if: contains(inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (semver, short sha, latest on main)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` is not derived automatically from the highest semver:
          # it is added explicitly for the default branch only, so a tag push
          # never moves :latest.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false

      - name: Trigger deployment webhook
        # Only when the secret exists. The value is never printed: no `set -x`,
        # no `echo`, and curl output is silenced (errors still fail the job).
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set +x
          curl --silent --show-error --fail-with-body \
               --retry 3 --retry-delay 5 --max-time 30 \
               -X POST "$DEPLOY_WEBHOOK_URL"
