name: Release

# Build and publish the multi-arch image to GHCR.
#
#   push to main  ->  ghcr.io/hansvaneijsden/media-optimizer:sha-<short> and :latest
#   tag v*        ->  ...:1.2.3, ...:1.2 and ...:sha-<short> (no latest)
#
# After the push, optionally POST to a deployment webhook so a managed
# deployment platform can pull the new image. The URL lives in the repository
# secret DEPLOY_WEBHOOK_URL and is never echoed.
#
# Multi-arch note: linux/arm64 is emulated on the amd64 runner (QEMU), and the
# image compiles mozjpeg and libvips from source, so this job is slow. The GHA
# cache is shared with the CI docker job, which builds linux/amd64 only.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  # Push to ghcr.io with GITHUB_TOKEN.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half-way: a partially pushed manifest list would
  # leave :latest pointing at one architecture.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hansvaneijsden/media-optimizer
  # Defined at workflow level because `if:` cannot read `secrets.*` directly.
  # When the secret is not configured this is the empty string and the webhook
  # step is skipped.
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

jobs:
  publish:
    name: build and push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (semver, short sha, latest on main)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` is not derived automatically from the highest semver:
          # it is added explicitly for the default branch only, so a tag push
          # never moves :latest.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false

      - name: Trigger deployment webhook
        # Only when the secret exists. The value is never printed: no `set -x`,
        # no `echo`, and curl output is silenced (errors still fail the job).
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set +x
          curl --silent --show-error --fail-with-body \
               --retry 3 --retry-delay 5 --max-time 30 \
               -X POST "$DEPLOY_WEBHOOK_URL"
