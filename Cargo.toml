[package]
name = "mediaopt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Idempotent, quality-targeted optimiser for WordPress and static image trees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HansVanEijsden/media-optimizer"
readme = "README.md"

[[bin]]
name = "mediaopt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
rayon = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
filetime = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
libc = "0.2"
oxipng = { version = "10", default-features = false, features = ["zopfli", "parallel"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests that touch real images in tests/fixtures need the engine binaries.
[profile.dev]
opt-level = 1
